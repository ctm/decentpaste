[workspace]
resolver = "2"
members = [
    "decentpaste-app/src-tauri",
    "decentpaste-app/tauri-plugin-decentsecret",
    "decentpaste-app/tauri-plugin-decentshare",
]

# All dependency versions live here. Member crates reference them with
# `<crate>.workspace = true` and only add crate-specific features.
[workspace.dependencies]

# Internal plugins
tauri-plugin-decentshare = { path = "decentpaste-app/tauri-plugin-decentshare" }
tauri-plugin-decentsecret = { path = "decentpaste-app/tauri-plugin-decentsecret" }

# Tauri
tauri = "2.11"
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2.6", features = ["build"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }
futures = "0.3"
async-trait = "0.1"

# libp2p networking
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "gossipsub",
    "request-response",
    "identify",
    "macros",
] }

# Cryptography
aes-gcm = "0.11"
argon2 = "0.5"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }
# keyring 3.x declares no `default` feature; each target opts into its backend.
keyring = { version = "3", default-features = false }

# Storage & utilities
hostname = "0.4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
