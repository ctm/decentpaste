[package]
name = "tauri-plugin-decentsecret"
version = "0.1.0"
authors = ["You"]
description = ""
edition = "2021"
# rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-decentsecret"

[dependencies]
tauri = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

# Desktop-only: OS keyring integration
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64 = "0.23"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring-core = { version = "1" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1" }

