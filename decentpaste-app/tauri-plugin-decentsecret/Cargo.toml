[package]
name = "tauri-plugin-decentsecret"
version = "0.1.0"
authors = ["You"]
description = ""
edition = "2021"
# rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-decentsecret"

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
tauri-plugin.workspace = true

# Desktop-only: OS keyring integration
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring-core = { version = "1" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1" }

