[package]
name = "decentpaste-app"
version = "0.8.1"
description = "Cross-platform clipboard sharing over P2P network"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "decentpaste_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Tauri
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-decentshare.workspace = true
tauri-plugin-decentsecret.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio.workspace = true

# libp2p networking
libp2p.workspace = true

# Cryptography
aes-gcm.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

# Storage & utilities
hostname.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Async utilities
futures.workspace = true
async-trait.workspace = true

# Desktop-only plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-global-shortcut.workspace = true
